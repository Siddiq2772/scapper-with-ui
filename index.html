<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH Nexus</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Smart <span class="accent">Scrapper</span></h1>
            <p id="breadcrumbs" class="breadcrumbs"><span class="active">Categories</span></p>
            <div id="card-count" class="card-count" style="display: none;"></div>
        </header>

        <main id="app">
            <!-- Content will be injected here -->
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading data...</p>
            </div>
            <div id="grid" class="grid-container"></div>
        </main>

        <!-- Detailed Modal -->
        <div id="detail-modal" class="modal-overlay">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">&times;</button>
                <div id="modal-body">
                    <div class="modal-header">
                        <span id="modal-id" class="modal-label"></span>
                        <div id="modal-org" class="modal-title"></div>
                        <div id="modal-cat" style="color: var(--text-secondary); margin-top: 0.5rem;"></div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">THEME</div>
                        <div id="modal-theme" class="modal-text"></div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">SUBMISSIONS</div>
                        <div id="modal-subs" class="modal-text"></div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">DEADLINE</div>
                        <div id="modal-deadline" class="modal-text"></div>
                    </div>

                    <div class="modal-section">
                        <div class="modal-section-title">PROBLEM STATEMENT</div>
                        <div id="modal-desc" class="modal-text"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="category-card-template">
        <div class="card">
            <div class="card-title"></div>
            <div class="card-meta">
                <span class="card-count-badge"></span>
                <span style="flex: 1;"></span>
                <span>Explore</span>
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M5 12h14m-7-7 7 7-7 7" />
                </svg>
            </div>
        </div>
    </template>

    <template id="problem-card-template">
        <div class="card" style="cursor: pointer;">
            <div>
                <span class="label"></span>
                <div class="card-title" style="font-size: 1.15rem; color: var(--text-primary);"></div>
            </div>
            <div class="problem-desc"></div>
        </div>
    </template>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
